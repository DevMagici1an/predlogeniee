      content: " ";

      0% { box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(88, 166, 255, 0.2); }

    }

      height: 6px;
      background: #1c212d;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .loading-text {
      font-size: 0.85rem;
      color: #8b949e;
    }

      display: none;
    }

    }

    .green { color: var(--green); font-weight: bold; text-shadow: 0 0 5px var(--green); }
    .accent { color: var(--accent); font-weight: bold; }
    .question { color: var(--cyan); font-weight: bold; text-shadow: 0 0 8px var(--cyan); }

    /* Glitch Text Effect */
    .glitch-text {
      position: relative;
      display: inline-block;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .glitch-text::before {
      left: -2px;
      text-shadow: 2px 0 var(--magenta);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-text::after {

  <script>
    const startContainer = document.getElementById('startContainer');
    const startBtn = document.getElementById('startBtn');
    const loader = document.getElementById('loader');
    const progressBar = document.getElementById('progressBar');
    const loadStatus = document.getElementById('loadStatus');
    const terminalContent = document.getElementById('terminalContent');
    const logLines = document.getElementById('log-lines');
    const promptBox = document.getElementById('prompt-box');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    const linesData = [
      { prefix: '[<span class="green">OK</span>]', text: ' System initialized.' },
      { prefix: '[<span class="green">OK</span>]', text: ' Secure connection established.' },
      { prefix: '[<span class="accent">INFO</span>]', text: ' Выговорить это вслух для меня слишком сложно — язык сразу заплетается.' },
      { prefix: '[<span class="accent">INFO</span>]', text: ' А писать длинные сообщения в ЛС было слишком страшно.' },
      { prefix: '[<span class="accent">INFO</span>]', text: ' Мне правда очень хорошо и уютно с тобой.' },
      { prefix: '[<span class="accent">INFO</span>]', text: ' Поэтому я собрала этот сайт, чтобы спросить напрямую...' },
      { prefix: '[<span class="pink">QUESTION</span>]', text: ' Ты будешь моей девушкой?' }
    ];

    let currentLineIndex = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    startBtn.addEventListener('click', () => {
      startContainer.style.display = 'none';
      loader.style.display = 'flex';
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        if (progress > 100) progress = 100;
        progressBar.style.width = progress + '%';
        loadStatus.textContent = 'LOADING SYSTEM MODULES... ' + progress + '%';

        if (progress === 100) {
          clearInterval(interval);
          setTimeout(() => {
            loader.style.display = 'none';
            terminalContent.style.display = 'block';
            printNextLine();
          }, 300);
        }
      }, 80);
    });

    function printNextLine() {
      if (currentLineIndex < linesData.length) {
        const item = linesData[currentLineIndex];
        const div = document.createElement('div');
        div.className = 'line glitch-text';
        div.innerHTML = item.prefix + ' ';
        
        const textSpan = document.createElement('span');
        div.appendChild(textSpan);
        div.appendChild(cursor);
        logLines.appendChild(div);

        let charIdx = 0;
        const text = item.text;
        const timer = setInterval(() => {
          if (charIdx < text.length) {
            textSpan.textContent += text[charIdx];
            charIdx++;
          } else {
            clearInterval(timer);
            currentLineIndex++;
            setTimeout(printNextLine, 250);
          }
        }, 30);
      } else {
        cursor.remove();
        promptBox.style.display = 'block';
      }
    }

    yesBtn.addEventListener('click', () => {
      promptBox.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'line glitch-text';
      div.innerHTML = '<br><div>[<span class="green">SUCCESS</span>] Status updated: IN_RELATIONSHIP = true</div><div>[<span class="green">OK</span>] Отлично! Напиши мне в лс или жди сообщения, всё обсудим 🚀🤍</div>';
      logLines.appendChild(div);
    });

    noBtn.addEventListener('click', () => {
      promptBox.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'line glitch-text';
      div.innerHTML = '<br><div>[<span class="accent">INFO</span>] Process terminated by user.</div><div>Принято, без проблем. Главное было сказать честно! Остаёмся на связи.</div>';
      logLines.appendChild(div);
    });
  </script>
